# Evaluation configuration for the release_readiness agent.
# Run with:
#   python wxodemo.py eval release-readiness
# (same as: orchestrate evaluations evaluate --config evaluation/release-readiness/eval_config.yaml)

test_paths:
  - evaluation/release-readiness/test_cases/

output_dir: evaluation/release-readiness/results/

n_runs: 1

enable_verbose_logging: true

llm_user_config:
  user_response_style:
    - "Be concise. Answer the agent's questions briefly."
