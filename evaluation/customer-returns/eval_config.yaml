# Evaluation configuration for the customer_returns agent.
# Run with:
#   python wxodemo.py eval customer-returns
# (same as: orchestrate evaluations evaluate --config evaluation/customer-returns/eval_config.yaml)

test_paths:
  - evaluation/customer-returns/test_cases/

output_dir: evaluation/customer-returns/results/

n_runs: 1

enable_verbose_logging: true

llm_user_config:
  user_response_style:
    - "Be concise. Answer the agent's questions briefly."
    - "Provide requested order or serial information when asked."
