# Evaluation configuration for the cloud_finops agent.
# Run with:
#   python wxodemo.py eval cloud-finops
# (same as: orchestrate evaluations evaluate --config evaluation/cloud-finops/eval_config.yaml)

test_paths:
  - evaluation/cloud-finops/test_cases/

output_dir: evaluation/cloud-finops/results/

n_runs: 1

enable_verbose_logging: true

llm_user_config:
  user_response_style:
    - "Be concise. Answer the agent's questions briefly."
    - "Do not trigger write flows unless requested."
