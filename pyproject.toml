[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxodemo"
version = "0.1.0"
description = "Single CLI to set up, deploy, test and manage the watsonx Orchestrate demo scenarios in this repo."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
wxodemo = "wxodemo.cli:main"

[tool.setuptools.dynamic]
# requirements.txt stays the single source of dependencies (also used by `wxodemo setup`).
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
