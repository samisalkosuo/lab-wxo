spec_version: v1
kind: knowledge_base
name: release_readiness_policy
description: |
  Release gate policy for the Release Readiness demo. Contains what blocks a release
  (RG-BLOCKER-01), when a conditional go is allowed (RG-CONDITIONAL-01), who may waive a
  blocker (RG-WAIVER-01), and why release checks cannot be skipped on request (RG-SKIP-01).
  Use it to decide go, conditional go or no-go from the QA, Security and Operations findings,
  and to cite the single policy document that justifies the recommendation.
documents:
  - policy/RG-BLOCKER-01.txt
  - policy/RG-CONDITIONAL-01.txt
  - policy/RG-WAIVER-01.txt
  - policy/RG-SKIP-01.txt
