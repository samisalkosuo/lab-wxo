<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>watsonx Orchestrate — Agent Solutions & Live Demo</title>
  <style>
    :root {
      --bg-primary: #121619;
      --bg-surface: #1a2024;
      --bg-surface-elevated: #222a30;
      --bg-card: #263038;
      --border-subtle: #2d3842;
      --border-accent: #0f62fe;
      --text-primary: #f4f6f8;
      --text-secondary: #c1c7cd;
      --text-muted: #878d96;
      --accent-blue: #0f62fe;
      --accent-blue-hover: #0353e9;
      --accent-cyan: #1192e8;
      --accent-purple: #8a3ffc;
      --accent-teal: #009d9a;
      --accent-green: #24a148;
      --accent-amber: #f1c21b;
      --accent-red: #da1e28;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "IBM Plex Mono", Consolas, Monaco, "Courier New", monospace;
      --sidebar-width: 280px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.5);
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --bg-primary: #f4f6f8;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      --bg-card: #f2f4f8;
      --border-subtle: #dde1e6;
      --border-accent: #0f62fe;
      --text-primary: #161616;
      --text-secondary: #525252;
      --text-muted: #697077;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-size: 15px;
      line-height: 1.5;
    }

    /* Layout Shell */
    .app-container {
      display: flex;
      flex: 1;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease, width 0.3s ease;
      z-index: 100;
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
      position: absolute;
      height: 100%;
    }

    .sidebar-header {
      padding: 20px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
    }

    .sidebar-header:hover {
      background-color: var(--bg-surface-elevated);
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      cursor: pointer;
      user-select: none;
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .nav-section-header:hover {
      background-color: var(--bg-surface-elevated);
    }

    .nav-section-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0;
    }

    .nav-count-badge {
      font-size: 10px;
      font-weight: 600;
      background: var(--bg-card);
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .nav-chevron {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-section.collapsed .nav-chevron {
      transform: rotate(-90deg);
    }

    .nav-section-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .nav-section.collapsed .nav-section-content {
      display: none;
    }

    .scenario-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .scenario-item {
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition: var(--transition);
      text-align: left;
    }

    .scenario-item:hover {
      background-color: var(--bg-surface-elevated);
      border-color: var(--border-subtle);
    }

    .scenario-item.active {
      background-color: var(--bg-surface-elevated);
      border-color: var(--accent-blue);
      box-shadow: inset 3px 0 0 var(--accent-blue);
    }

    .scenario-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }

    .scenario-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .scenario-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-active {
      background: rgba(15, 98, 254, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(15, 98, 254, 0.3);
    }

    .badge-upcoming {
      background: rgba(135, 141, 150, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .badge-standalone {
      background: rgba(138, 63, 252, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(138, 63, 252, 0.3);
    }

    .scenario-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slide-toc {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
      padding-left: 8px;
    }

    .toc-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .toc-item:hover {
      color: var(--text-primary);
      background-color: var(--bg-card);
    }

    .toc-item.active {
      color: var(--accent-cyan);
      font-weight: 600;
      background-color: var(--bg-card);
    }

    .toc-num {
      font-size: 11px;
      font-family: var(--font-mono);
      opacity: 0.7;
    }

    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .theme-toggle-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    /* Main Presentation Viewport */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-primary);
      position: relative;
    }

    /* Top Control Bar */
    .top-bar {
      height: 56px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 50;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .btn-icon:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    .current-scenario-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scenario-pill {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(15, 98, 254, 0.2);
      color: var(--accent-cyan);
      border-radius: 12px;
      font-weight: 500;
    }

    .top-bar-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slide-counter {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .kbd-shortcut {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 3px 6px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
    }

    /* Progress bar */
    .progress-bar-container {
      height: 3px;
      width: 100%;
      background: var(--bg-surface);
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
      width: 16.66%;
      transition: width 0.3s ease;
    }

    /* Slide Stage */
    .slide-stage {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .slide-content-wrapper {
      width: 100%;
      max-width: 1100px;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Slide Headers & Typography */
    .slide-header {
      margin-bottom: 24px;
    }

    .slide-tag {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .slide-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .slide-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 800px;
      line-height: 1.5;
    }

    /* Grid & Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .card:hover {
      border-color: var(--border-accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .icon-blue { background: rgba(15, 98, 254, 0.15); color: var(--accent-cyan); }
    .icon-purple { background: rgba(138, 63, 252, 0.15); color: var(--accent-purple); }
    .icon-teal { background: rgba(0, 157, 154, 0.15); color: var(--accent-teal); }
    .icon-green { background: rgba(36, 161, 72, 0.15); color: var(--accent-green); }
    .icon-amber { background: rgba(241, 194, 27, 0.15); color: var(--accent-amber); }
    .icon-red { background: rgba(218, 30, 40, 0.15); color: var(--accent-red); }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card-body {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .card-body ul {
      padding-left: 18px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Comparison Table / Matrix */
    .table-container {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    th {
      background-color: var(--bg-card);
      color: var(--text-primary);
      padding: 12px 16px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: var(--bg-surface-elevated);
    }

    .tool-chip {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--bg-card);
      color: var(--accent-cyan);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      display: inline-block;
    }

    .service-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Key Callout Banner */
    .callout-banner {
      background: linear-gradient(135deg, rgba(15, 98, 254, 0.1), rgba(138, 63, 252, 0.08));
      border: 1px solid rgba(15, 98, 254, 0.3);
      border-left: 4px solid var(--accent-blue);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .callout-icon {
      font-size: 20px;
      color: var(--accent-cyan);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .callout-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .callout-text {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Target Fit & Audience Card */
    .fit-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    @media (max-width: 900px) {
      .fit-card {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    .fit-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fit-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fit-label-icon {
      font-size: 13px;
    }

    .fit-value {
      font-size: 13.5px;
      color: var(--text-primary);
      line-height: 1.4;
      font-weight: 500;
    }

    .fit-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .fit-pill {
      font-size: 12px;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      padding: 2px 9px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      line-height: 1.4;
    }

    /* Prompts Grid Slide Styles */
    .prompts-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .prompt-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .prompt-card:hover {
      border-color: var(--accent-blue);
      box-shadow: var(--shadow-md);
    }

    .prompt-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .prompt-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scene-pill {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(15, 98, 254, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(15, 98, 254, 0.3);
    }

    .prompt-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .copy-btn {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
    }

    .copy-btn.copied {
      background: var(--accent-green);
    }

    .prompt-box {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.5;
      user-select: all;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
    }

    .prompt-tip {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .prompt-tip svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      fill: var(--accent-amber);
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      height: 60px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 50;
    }

    .nav-btn {
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .nav-btn:hover:not(:disabled) {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .slide-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--border-subtle);
      cursor: pointer;
      transition: var(--transition);
    }

    .dot.active {
      background-color: var(--accent-blue);
      width: 24px;
      border-radius: 4px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 74px;
      right: 28px;
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--accent-green);
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-lg);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Home Dashboard View */
    .home-hero {
      margin-bottom: 28px;
    }

    .home-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .kpi-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .kpi-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .kpi-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
      font-family: var(--font-mono);
    }

    .kpi-label {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .kpi-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .home-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .home-section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .home-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 36px;
    }

    @media (max-width: 1050px) {
      .home-cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .home-cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .home-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      text-align: left;
    }

    .home-card:hover {
      background-color: var(--bg-surface-elevated);
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .home-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .home-card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .home-card-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 16px;
      flex: 1;
    }

    .home-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-cyan);
    }

    .home-card:hover .home-card-footer {
      color: var(--accent-blue-hover);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
      .slide-stage {
        padding: 20px;
      }
      .sidebar {
        position: absolute;
        height: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header" onclick="goHome()" title="Return to Overview / Catalog">
        <div class="brand-icon">wx</div>
        <div>
          <div class="brand-title">watsonx Orchestrate</div>
          <div class="brand-sub">Agent Solutions & Demos</div>
        </div>
      </div>

      <div class="sidebar-content">
        <!-- Slide TOC (Shown only when viewing an active Scenario or Agent) -->
        <div class="nav-section" id="toc-section" style="display: none; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 4px;">
          <div class="nav-section-title" id="scenario-toc-title" style="padding-left: 8px;">Scenario 1 Slides</div>
          <div class="slide-toc" id="slide-toc">
            <!-- Populated dynamically via JS -->
          </div>
        </div>

        <!-- Demo Scenarios Accordion -->
        <div class="nav-section" id="scenarios-section">
          <div class="nav-section-header" onclick="toggleNavSection('scenarios')">
            <div class="nav-section-title-wrap">
              <span class="nav-section-title">Demo Scenarios</span>
              <span class="nav-count-badge" id="scenarios-count">0</span>
            </div>
            <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="nav-section-content scenario-list" id="scenarios-list">
            <!-- Populated dynamically from window.SCENARIOS -->
          </div>
        </div>

        <!-- Standalone Agents Accordion -->
        <div class="nav-section" id="agents-section">
          <div class="nav-section-header" onclick="toggleNavSection('agents')">
            <div class="nav-section-title-wrap">
              <span class="nav-section-title">Standalone Agents</span>
              <span class="nav-count-badge" id="agents-count">0</span>
            </div>
            <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="nav-section-content scenario-list" id="agents-list">
            <!-- Populated dynamically from window.STANDALONE_AGENTS -->
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="theme-toggle-btn" onclick="toggleTheme()">
          <span id="theme-icon">☀️</span>
          <span id="theme-label">Light Mode</span>
        </button>
        <span class="kbd-shortcut">v1.0.0</span>
      </div>
    </aside>

    <!-- Main Presentation Stage -->
    <main class="main-viewport">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="btn-icon" onclick="toggleSidebar()" title="Toggle Sidebar (S)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="current-scenario-title">
            <span id="top-scenario-name">Incident Triage Agent</span>
            <span class="scenario-pill" id="top-scenario-pill">Production Demo</span>
          </div>
        </div>

        <div class="top-bar-center">
          <div class="slide-counter" id="slide-counter">1 / 6</div>
        </div>

        <div class="top-bar-right">
          <div class="kbd-shortcut" id="nav-hint">← / → to navigate</div>
          <button class="btn-icon" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Progress bar -->
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <!-- Slide Stage Area -->
      <div class="slide-stage" id="slide-stage">
        <div class="slide-content-wrapper" id="slide-content">
          <!-- Slide content injected here -->
        </div>
      </div>

      <!-- Bottom Navigation Bar -->
      <footer class="bottom-bar">
        <button class="nav-btn" id="prev-btn" onclick="prevSlide()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Previous
        </button>

        <div class="slide-dots" id="slide-dots">
          <!-- Dots injected here -->
        </div>

        <button class="nav-btn" id="next-btn" onclick="nextSlide()">
          Next
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </footer>
    </main>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span>Prompt copied to clipboard!</span>
  </div>

  <script src="scenarios/incident-triage.js"></script>
  <script src="scenarios/customer-returns.js"></script>
  <script src="scenarios/release-readiness.js"></script>
  <script src="scenarios/hr-onboarding.js"></script>
  <script src="scenarios/cloud-finops.js"></script>
  <script src="scenarios/travel-request.js"></script>
  <script src="standalone-agents.js"></script>
  <script>
    // Data Models
    const scenariosData = window.SCENARIOS || [];
    const agentsData = window.STANDALONE_AGENTS || [];

    // State
    let currentType = "home"; // "home" | "scenario" | "agent"
    let currentScenarioIdx = -1;
    let currentAgentIdx = -1;
    let currentSlideIdx = 0;

    // Elements
    const slideStage = document.getElementById("slide-stage");
    const slideContent = document.getElementById("slide-content");
    const slideCounter = document.getElementById("slide-counter");
    const progressBar = document.getElementById("progress-bar");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const slideDots = document.getElementById("slide-dots");
    const slideToc = document.getElementById("slide-toc");
    const topScenarioName = document.getElementById("top-scenario-name");
    const topScenarioPill = document.getElementById("top-scenario-pill");
    const scenarioTocTitle = document.getElementById("scenario-toc-title");
    const sidebar = document.getElementById("sidebar");
    const toast = document.getElementById("toast");
    const bottomBar = document.querySelector(".bottom-bar");
    const navHint = document.getElementById("nav-hint");

    // Toggle collapsible accordion section
    function toggleNavSection(id) {
      const section = document.getElementById(`${id}-section`);
      if (section) {
        section.classList.toggle("collapsed");
      }
    }

    // Helper to return home
    function goHome() {
      currentType = "home";
      currentScenarioIdx = -1;
      currentAgentIdx = -1;
      currentSlideIdx = 0;
      updateNavItems();
      renderDeck();
    }

    // Helper to get active deck
    function getActiveDeck() {
      return currentType === "scenario" ? scenariosData[currentScenarioIdx] : agentsData[currentAgentIdx];
    }

    // Build the sidebar scenario buttons from window.SCENARIOS
    function buildScenarioList() {
      const list = document.getElementById("scenarios-list");
      document.getElementById("scenarios-count").textContent = scenariosData.length;
      list.innerHTML = "";
      scenariosData.forEach((scenario, idx) => {
        const live = scenario.status === "live";
        const btn = document.createElement("button");
        btn.className = "scenario-item";
        btn.dataset.type = "scenario";
        btn.dataset.index = idx;
        btn.onclick = () => switchScenario(idx);

        const header = document.createElement("div");
        header.className = "scenario-item-header";
        const name = document.createElement("span");
        name.className = "scenario-name";
        name.textContent = `${idx + 1}. ${scenario.label}`;
        const badge = document.createElement("span");
        badge.className = `scenario-badge ${live ? "badge-active" : "badge-upcoming"}`;
        badge.textContent = live ? "Live" : "Coming Soon";
        header.append(name, badge);

        const desc = document.createElement("div");
        desc.className = "scenario-desc";
        desc.textContent = scenario.description;

        btn.append(header, desc);
        list.appendChild(btn);
      });
    }

    // Build the sidebar standalone agent buttons from window.STANDALONE_AGENTS
    function buildAgentList() {
      const list = document.getElementById("agents-list");
      document.getElementById("agents-count").textContent = agentsData.length;
      list.innerHTML = "";
      agentsData.forEach((agent, idx) => {
        const btn = document.createElement("button");
        btn.className = "scenario-item";
        btn.dataset.type = "agent";
        btn.dataset.index = idx;
        btn.onclick = () => switchAgent(idx);

        const header = document.createElement("div");
        header.className = "scenario-item-header";
        const name = document.createElement("span");
        name.className = "scenario-name";
        name.textContent = agent.label;
        const badge = document.createElement("span");
        badge.className = "scenario-badge badge-standalone";
        badge.textContent = "Agent";
        header.append(name, badge);

        const desc = document.createElement("div");
        desc.className = "scenario-desc";
        desc.textContent = agent.description;

        btn.append(header, desc);
        list.appendChild(btn);
      });
    }

    // Initialize
    function init() {
      buildScenarioList();
      buildAgentList();

      // Check URL hash (e.g. #scenario/0/2 or #agent/1/0 or #home)
      if (window.location.hash && window.location.hash !== "#home" && window.location.hash !== "#") {
        const parts = window.location.hash.replace("#", "").split("/");
        if (parts.length === 3) {
          const type = parts[0];
          const itemIdx = parseInt(parts[1], 10);
          const slIdx = parseInt(parts[2], 10);
          if (type === "agent" && !isNaN(itemIdx) && itemIdx < agentsData.length) {
            currentType = "agent";
            currentAgentIdx = itemIdx;
            if (!isNaN(slIdx) && slIdx < agentsData[itemIdx].slides.length) currentSlideIdx = slIdx;
          } else if (type === "scenario" && !isNaN(itemIdx) && itemIdx < scenariosData.length) {
            currentType = "scenario";
            currentScenarioIdx = itemIdx;
            if (!isNaN(slIdx) && slIdx < scenariosData[itemIdx].slides.length) currentSlideIdx = slIdx;
          }
        } else if (parts.length === 2) {
          const sIdx = parseInt(parts[0], 10);
          const slIdx = parseInt(parts[1], 10);
          if (!isNaN(sIdx) && sIdx < scenariosData.length) {
            currentType = "scenario";
            currentScenarioIdx = sIdx;
            if (!isNaN(slIdx) && slIdx < scenariosData[currentScenarioIdx].slides.length) currentSlideIdx = slIdx;
          }
        }
      } else {
        currentType = "home";
      }

      updateNavItems();
      renderDeck();
      document.addEventListener("keydown", handleKeydown);
    }

    function switchScenario(index) {
      if (currentType === "scenario" && index === currentScenarioIdx) return;
      currentType = "scenario";
      currentScenarioIdx = index;
      currentSlideIdx = 0;
      updateNavItems();
      renderDeck();
    }

    function switchAgent(index) {
      if (currentType === "agent" && index === currentAgentIdx) return;
      currentType = "agent";
      currentAgentIdx = index;
      currentSlideIdx = 0;
      updateNavItems();
      renderDeck();
    }

    function updateNavItems() {
      const scenarioBtns = document.querySelectorAll('#scenarios-list .scenario-item');
      scenarioBtns.forEach((btn, idx) => {
        btn.classList.toggle("active", currentType === "scenario" && idx === currentScenarioIdx);
      });

      const agentBtns = document.querySelectorAll('#agents-list .scenario-item');
      agentBtns.forEach((btn, idx) => {
        btn.classList.toggle("active", currentType === "agent" && idx === currentAgentIdx);
      });

      const tocSection = document.getElementById("toc-section");
      if (tocSection) {
        tocSection.style.display = currentType === "home" ? "none" : "flex";
      }
    }

    function renderDeck() {
      if (currentType === "home") {
        topScenarioName.textContent = "watsonx Orchestrate — Solutions & Live Demos";
        topScenarioPill.textContent = "Catalog Overview";
        if (slideCounter) slideCounter.style.display = "none";
        if (navHint) navHint.style.display = "none";
        progressBar.style.width = "0%";
        if (bottomBar) bottomBar.style.display = "none";
        window.location.hash = "home";

        slideContent.innerHTML = `
          <div class="home-hero">
            <div class="slide-tag">Catalog • Solutions & Demos</div>
            <h1 class="slide-title">watsonx Orchestrate Agent Catalog</h1>
            <p class="slide-subtitle">Explore interactive production demo scenarios and specialized standalone agents. Click any tile or use the left navigation to open a solution deck.</p>
          </div>

          <div class="home-kpi-grid">
            <div class="kpi-card">
              <div class="kpi-icon-wrap icon-blue">🚀</div>
              <div>
                <div class="kpi-num">${scenariosData.length}</div>
                <div class="kpi-label">Demo Scenarios</div>
                <div class="kpi-sub">${scenariosData.filter(s => s.status === 'live').length} Live Demos • ${scenariosData.filter(s => s.status !== 'live').length} Upcoming</div>
              </div>
            </div>
            <div class="kpi-card">
              <div class="kpi-icon-wrap icon-purple">🤖</div>
              <div>
                <div class="kpi-num">${agentsData.length}</div>
                <div class="kpi-label">Standalone Agents</div>
                <div class="kpi-sub">Specialized prompt & tool utilities</div>
              </div>
            </div>
          </div>

          <div class="home-section-header">
            <div class="home-section-title">
              <span>🚀</span>
              <span>Demo Scenarios</span>
            </div>
            <span class="nav-count-badge">${scenariosData.length} Total</span>
          </div>

          <div class="home-cards-grid">
            ${scenariosData.map((scenario, idx) => `
              <div class="home-card" onclick="switchScenario(${idx})">
                <div>
                  <div class="home-card-header">
                    <div class="home-card-title">${idx + 1}. ${scenario.name}</div>
                    <span class="scenario-badge ${scenario.status === 'live' ? 'badge-active' : 'badge-upcoming'}">
                      ${scenario.status === 'live' ? 'Live' : 'Coming Soon'}
                    </span>
                  </div>
                  <div class="home-card-desc">${scenario.description}</div>
                </div>
                <div class="home-card-footer">
                  <span>${scenario.slides.length} Slides</span>
                  <span>Explore Scenario →</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="home-section-header">
            <div class="home-section-title">
              <span>🤖</span>
              <span>Standalone Agents</span>
            </div>
            <span class="nav-count-badge">${agentsData.length} Total</span>
          </div>

          <div class="home-cards-grid">
            ${agentsData.map((agent, idx) => `
              <div class="home-card" onclick="switchAgent(${idx})">
                <div>
                  <div class="home-card-header">
                    <div class="home-card-title">${agent.name}</div>
                    <span class="scenario-badge badge-standalone">Agent</span>
                  </div>
                  <div class="home-card-desc">${agent.description}</div>
                </div>
                <div class="home-card-footer">
                  <span>${agent.slides.length} Slides</span>
                  <span>View Prompts & Purpose →</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;

        slideStage.scrollTop = 0;
        return;
      }

      if (bottomBar) bottomBar.style.display = "flex";
      if (slideCounter) slideCounter.style.display = "block";
      if (navHint) navHint.style.display = "inline-flex";
      const deck = getActiveDeck();
      if (!deck) return;

      topScenarioName.textContent = deck.name;
      if (currentType === "scenario") {
        topScenarioPill.textContent = deck.status === "live" ? "Production Demo" : "Coming Soon";
        scenarioTocTitle.textContent = `Scenario ${currentScenarioIdx + 1} Slides`;
      } else {
        topScenarioPill.textContent = "Standalone Agent";
        scenarioTocTitle.textContent = `${deck.label} Slides`;
      }

      // Build Table of Contents
      slideToc.innerHTML = "";
      deck.slides.forEach((slide, idx) => {
        const tocItem = document.createElement("div");
        tocItem.className = `toc-item ${idx === currentSlideIdx ? "active" : ""}`;
        tocItem.onclick = () => goToSlide(idx);
        tocItem.innerHTML = `<span class="toc-num">0${idx + 1}</span><span>${slide.title}</span>`;
        slideToc.appendChild(tocItem);
      });

      // Build Dots
      slideDots.innerHTML = "";
      deck.slides.forEach((_, idx) => {
        const dot = document.createElement("div");
        dot.className = `dot ${idx === currentSlideIdx ? "active" : ""}`;
        dot.onclick = () => goToSlide(idx);
        slideDots.appendChild(dot);
      });

      renderCurrentSlide();
    }

    function renderCurrentSlide() {
      const deck = getActiveDeck();
      if (!deck || !deck.slides[currentSlideIdx]) return;
      const slide = deck.slides[currentSlideIdx];

      // Update Top Counter & Progress
      slideCounter.textContent = `${currentSlideIdx + 1} / ${deck.slides.length}`;
      const progressPercent = ((currentSlideIdx + 1) / deck.slides.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // Update Nav Buttons
      prevBtn.disabled = currentSlideIdx === 0;
      nextBtn.disabled = currentSlideIdx === deck.slides.length - 1;

      // Update TOC and Dots active classes
      const tocItems = slideToc.querySelectorAll(".toc-item");
      tocItems.forEach((item, idx) => item.classList.toggle("active", idx === currentSlideIdx));

      const dots = slideDots.querySelectorAll(".dot");
      dots.forEach((dot, idx) => dot.classList.toggle("active", idx === currentSlideIdx));

      // Update Hash
      const currentIdx = currentType === "scenario" ? currentScenarioIdx : currentAgentIdx;
      window.location.hash = `${currentType}/${currentIdx}/${currentSlideIdx}`;

      // Render Slide Content
      slideContent.innerHTML = `
        <div class="slide-header">
          <div class="slide-tag">${slide.tag}</div>
          <h1 class="slide-title">${slide.title}</h1>
          <p class="slide-subtitle">${slide.subtitle}</p>
        </div>
        ${slide.render()}
      `;

      // Scroll top
      slideStage.scrollTop = 0;
    }

    function goToSlide(index) {
      const deck = getActiveDeck();
      if (deck && index >= 0 && index < deck.slides.length) {
        currentSlideIdx = index;
        renderCurrentSlide();
      }
    }

    function nextSlide() {
      const deck = getActiveDeck();
      if (deck && currentSlideIdx < deck.slides.length - 1) {
        currentSlideIdx++;
        renderCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderCurrentSlide();
      }
    }

    function handleKeydown(e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "ArrowRight" || e.key === "Space") {
        if (currentType !== "home") {
          e.preventDefault();
          nextSlide();
        }
      } else if (e.key === "ArrowLeft") {
        if (currentType !== "home") {
          e.preventDefault();
          prevSlide();
        }
      } else if (e.key.toLowerCase() === "f") {
        toggleFullscreen();
      } else if (e.key.toLowerCase() === "s") {
        toggleSidebar();
      } else if (e.key.toLowerCase() === "h") {
        goHome();
      }
    }

    function toggleSidebar() {
      sidebar.classList.toggle("collapsed");
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    let isLight = false;
    function toggleTheme() {
      isLight = !isLight;
      document.body.setAttribute("data-theme", isLight ? "light" : "dark");
      document.getElementById("theme-icon").textContent = isLight ? "🌙" : "☀️";
      document.getElementById("theme-label").textContent = isLight ? "Dark Mode" : "Light Mode";
    }

    // Copy to clipboard utility
    function copyPrompt(elementId, btn) {
      const text = document.getElementById(elementId).innerText.trim();
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.classList.add("copied");
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Copied!
        `;
        showToast("Prompt copied to clipboard!");
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = originalText;
        }, 2200);
      }).catch(err => {
        console.error("Copy failed: ", err);
      });
    }

    let toastTimer = null;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toast.querySelector("span").textContent = msg;
      toast.classList.add("show");
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    window.onload = init;
  </script>
</body>
</html>
